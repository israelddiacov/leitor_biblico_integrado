[project]
name = "leitor_biblico_integrado"
version = "0.1.0"
description = "Leitor e buscador de referencias biblicas com Streamlit e SQLite"
authors = [
    {name = "israelddiacov",email = "israelddiacov@outlook.com.br"}
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false